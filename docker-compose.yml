# ==============================================================
# AI Content Factory — Docker Compose
# 启动: docker compose up -d
# ==============================================================

services:
  # PostgreSQL 16 + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: acf
      POSTGRES_PASSWORD: acf_dev_2026
      POSTGRES_DB: acf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acf"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis (W3+ 用于缓存，非必须)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Langfuse (LLM 可观测)
  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://acf:acf_dev_2026@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: langfuse-secret-change-me
      SALT: langfuse-salt-change-me
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
