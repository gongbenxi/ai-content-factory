[project]
name = "ai-content-factory"
version = "0.1.0"
description = "多 Agent 化的中文图文生成流水线"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",

    # LLM
    "openai>=1.57",

    # Agent orchestration
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",

    # Observability
    "langfuse>=2.60",

    # Web search & scraping
    "tavily-python>=0.5",
    "crawl4ai>=0.4",
    "httpx>=0.28",

    # Image generation
    "matplotlib>=3.10",
    "Pillow>=11.0",
    "pyecharts>=2.0",
    "playwright>=1.49",

    # Database
    "psycopg[binary]>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",

    # RSS
    "feedparser>=6.0",

    # Retry
    "tenacity>=9.0",

    # Misc
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
